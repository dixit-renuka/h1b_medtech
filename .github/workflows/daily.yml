name: Refresh H-1B data daily
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_data.py
      - name: Commit updated data
        run: |
          git config user.name "h1b-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Daily H-1B data refresh" && git push)
